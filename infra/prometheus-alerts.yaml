groups:
  - name: kijani-kiosk-alerts
    rules:
      # Deployed and tested: see docs/evidence/prometheus-*.txt
      # Ratio of 5xx responses to all responses, per namespace.
      # sum by (namespace) is needed: without it each 500 series is divided by
      # itself (labels must match exactly), so the ratio is always 1.
      - alert: HighErrorRate
        expr: |
          sum by (namespace) (rate(kk_payments_requests_total{status=~"5.."}[5m]))
          /
          sum by (namespace) (rate(kk_payments_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on kk-payments"
          description: "5xx rate above 5% for 2+ minutes in {{ $labels.namespace }}"

      # Requires kube-state-metrics, which is NOT deployed yet (Production Gap).
      # This rule loads but cannot fire until kube-state-metrics is installed.
      - alert: PodCrashLoopBackOff
        expr: |
          kube_pod_container_status_waiting_reason{
            reason="CrashLoopBackOff",
            namespace=~"kijani-.*"
          } == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pod in CrashLoopBackOff"
          description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is crash-looping"

      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95,
            sum by (namespace, le) (rate(kk_payments_request_latency_seconds_bucket[5m]))
          ) > 1.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on kk-payments"
          description: "p95 latency above 1s for 2+ minutes in {{ $labels.namespace }}"
