groups:
  - name: kijani-kiosk-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(flask_http_request_total{status=~"5.."}[5m]) / rate(flask_http_request_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          namespace: kijani-staging
        annotations:
          summary: "High error rate on kk-payments"
          description: "Error rate is above 5% for more than 2 minutes in {{ $labels.namespace }}"

      - alert: PodCrashLoopBackOff
        expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", namespace=~"kijani-.*"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pod in CrashLoopBackOff"
          description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is in CrashLoopBackOff"
