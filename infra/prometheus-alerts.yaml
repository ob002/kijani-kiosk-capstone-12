groups:
  - name: kijani-kiosk-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          rate(kk_payments_requests_total{status="500"}[5m])
          /
          rate(kk_payments_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          namespace: kijani-staging
        annotations:
          summary: "High error rate on kk-payments"
          description: "Error rate above 5% for 2+ minutes in {{ $labels.namespace }}"

      - alert: PodCrashLoopBackOff
        expr: |
          kube_pod_container_status_waiting_reason{
            reason="CrashLoopBackOff",
            namespace=~"kijani-.*"
          } == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pod in CrashLoopBackOff"
          description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is crash-looping"

      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95,
            rate(kk_payments_request_latency_seconds_bucket[5m])
          ) > 1.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on kk-payments"
          description: "p95 latency above 1s for 2+ minutes"
