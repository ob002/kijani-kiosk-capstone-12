apiVersion: v1
kind: Namespace
metadata:
  name: kijani-staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kijani-kiosk
  namespace: kijani-staging
  labels:
    app: kijani-kiosk
    env: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kijani-kiosk
  template:
    metadata:
      labels:
        app: kijani-kiosk
        env: staging
    spec:
      containers:
      - name: kiosk-api
        image: your-dockerhub-username/kijani-kiosk:latest
        ports:
        - containerPort: 5000
        env:
        - name: ENVIRONMENT
          value: "staging"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
