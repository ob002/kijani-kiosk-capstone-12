---
# Configures the kijani-staging namespace after Terraform has created it.
# Ansible owns environment configuration (labels, ConfigMap, Service).
# Jenkins owns the Deployment, because the image tag changes on every build.
#
# Run:  ansible-playbook infra/ansible/configure-staging.yml
# Needs: ansible-galaxy collection install kubernetes.core ; pip install kubernetes
- name: Configure kijani-staging environment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_ns: kijani-staging
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('~/.kube/config', true) }}"

  tasks:
    - name: Label the staging namespace (namespace itself is created by Terraform)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: patched
        kind: Namespace
        name: "{{ target_ns }}"
        definition:
          metadata:
            labels:
              configured-by: ansible

    - name: Apply staging ConfigMap (DB_HOST=kk-payments-staging-db)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        namespace: "{{ target_ns }}"
        src: "{{ playbook_dir }}/../k8s/staging-configmap.yaml"

    - name: Apply kk-payments Service
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        namespace: "{{ target_ns }}"
        src: "{{ playbook_dir }}/../k8s/service.yaml"

    - name: Read back the staging ConfigMap
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: ConfigMap
        name: kk-payments-config
        namespace: "{{ target_ns }}"
      register: cm

    - name: Fail if staging is pointing at the production database
      ansible.builtin.assert:
        that:
          - cm.resources[0].data.DB_HOST == 'kk-payments-staging-db'
        fail_msg: "Staging DB_HOST is {{ cm.resources[0].data.DB_HOST }}, expected kk-payments-staging-db"
        success_msg: "Staging DB_HOST is kk-payments-staging-db"

    - name: Report running kk-payments pods (deployed by Jenkins)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Pod
        namespace: "{{ target_ns }}"
        label_selectors:
          - app=kk-payments
      register: pod_list

    - name: Show pod status
      ansible.builtin.debug:
        msg: "{{ pod_list.resources | map(attribute='metadata.name') | zip(pod_list.resources | map(attribute='status.phase')) | list }}"
