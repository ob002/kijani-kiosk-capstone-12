---
- name: Configure kijani-staging environment
  hosts: localhost
  connection: local
  vars:
    namespace: kijani-staging
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('~/.kube/config') }}"

  tasks:
    - name: Apply staging ConfigMap
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/../k8s/staging-configmap.yaml"
        kubeconfig: "{{ kubeconfig }}"

    - name: Apply staging Deployment
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/../k8s/staging-deployment.yaml"
        kubeconfig: "{{ kubeconfig }}"

    - name: Verify staging pods are running
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - app=kijani-kiosk
        kubeconfig: "{{ kubeconfig }}"
      register: pod_list
      until: pod_list.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
      retries: 10
      delay: 10
